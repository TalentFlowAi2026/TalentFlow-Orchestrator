[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "talentflow-orchestrator"
version = "0.1.0"
description = "Independent TalentFlow scheduling, Calendar, and invitation orchestration service"
requires-python = ">=3.12,<3.14"
dependencies = [
  "asyncpg>=0.30,<1",
  "cryptography>=44,<51",
  "fastapi>=0.115,<1",
  "google-genai>=2.13,<3",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.8,<3",
  "PyJWT[crypto]>=2.10,<3",
  "tzdata>=2025.2,<2027",
  "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
  "asyncpg-stubs>=0.30",
  "mypy>=1.15",
  "pip-audit>=2.9",
  "pytest>=8.3,<10",
  "pytest-asyncio>=1,<2",
  "pytest-cov>=6,<8",
  "ruff>=0.12",
]

[project.scripts]
talentflow-orchestrator-api = "talentflow_orchestrator.api.app:main"
talentflow-orchestrator-worker = "talentflow_orchestrator.workers.consumer:main"
talentflow-orchestrator-doctor = "talentflow_orchestrator.doctor:main"

[tool.hatch.build.targets.wheel]
packages = ["src/talentflow_orchestrator"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/pyproject.toml", "/README.md"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv", ".uv-cache-orchestrator", ".azure-cli", ".pip-audit-cache", ".build-artifacts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["talentflow_orchestrator"]
mypy_path = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "--strict-markers"
markers = [
  "live_google: explicitly enabled Google Calendar/Gmail integration tests",
  "postgres: local disposable PostgreSQL contract tests",
]

[tool.coverage.run]
source = ["talentflow_orchestrator"]
